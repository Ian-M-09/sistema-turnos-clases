[build]
  # [build] abre la sección de configuración de la compilación.
  command = "npm run build"
  # Comando que Netlify corre para compilar el proyecto.
  publish = ".next"
  # Carpeta con el resultado de la compilación, que es lo que se publica.
  # Va sin barra adelante. Este valor es el que Netlify sugiere para Next.js,
  # y tiene prioridad sobre lo que haya cargado en la pantalla del sitio.