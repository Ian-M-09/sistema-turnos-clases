[build]
  command = "npm run build"
  # Comando que Netlify corre para compilar el proyecto.
  publish = ".next"
  # Carpeta con el resultado de la compilación.

[[plugins]]
  # Con doble corchete, TOML agrega un elemento a una LISTA. Acá, la
  # lista de plugins que Netlify tiene que ejecutar durante el build.
  package = "@netlify/plugin-nextjs"
  # Plugin oficial de Netlify para Next.js: convierte las páginas dinámicas
  # y las rutas /api en funciones que Netlify puede ejecutar.
  [build.environment]
  # Variables de entorno que Netlify usa SOLO durante el build.
  # Van acá (y no en la pantalla de Netlify) para que el fork de la
  # profesora las herede sin cargarlas a mano. Nunca poner claves acá:
  # este archivo está en el repo público.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/"
  # Carpeta que el escáner de secretos saltea: es la caché de Turbopack,
  # que guarda los valores de las variables leídas en el build (falso positivo).
